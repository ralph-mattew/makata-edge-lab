name: Bug
description: Something in the Swift package or a PoC script doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands or code, with the output.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Device, OS version, Swift or tool versions.
    validations:
      required: true
