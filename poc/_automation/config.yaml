# Automated Research-to-PoC Pipeline Configuration

# Research sources
sources:
  # When true, Stage 3 fetches arXiv full text (ar5iv HTML) for extraction
  # instead of relying on the abstract alone; falls back to abstract on failure.
  fetch_fulltext: false
  fulltext_char_budget: 20000

  # Semantic discovery arm: embed the lab's open problems + recent arXiv abstracts
  # and keep the closest papers — finds relevant work the keyword list misses.
  # Needs sentence-transformers (pip install sentence-transformers); disabled by
  # default so it doesn't load a model unless opted in.
  semantic:
    enabled: false
    model: "sentence-transformers/all-MiniLM-L6-v2"
    categories: ["cs.CL", "cs.LG", "cs.AI", "cs.IR"]
    pool_size: 200        # recent papers to embed and rank
    top_k: 15             # keep the closest N
    min_similarity: 0.35  # cosine floor (0-1)
    problems:
      - "Reduce on-device RAG memory below a 600MB embedding model on a 6GB iPhone without losing recall"
      - "Improve retrieval recall@3 above 61.4% under mobile memory and thermal constraints"
      - "Smaller or faster embedding and reranking models for offline document QA on mobile"
      - "Low-bit / ternary / binary quantization that runs under llama.cpp or MLX on iPhone"

  arxiv:
    enabled: true
    categories: ["cs.CL", "cs.LG", "cs.AI", "cs.IR"]
    keywords:
      - "mobile AI"
      - "edge AI"
      - "on-device"
      - "quantization"
      - "RAG"
      - "retrieval"
      - "embedding"
      - "efficient transformer"
      - "model compression"
      - "ternary"
      - "binary"
      - "low-bit"

  huggingface:
    enabled: true
    blog_url: "https://huggingface.co/blog"
    papers_url: "https://huggingface.co/papers"
    keywords:
      - "mobile"
      - "edge"
      - "quantization"
      - "ternary"
      - "1-bit"
      - "RAG"
      - "retrieval"

  papers_with_code:
    enabled: false  # Requires API key
    keywords:
      - "mobile NLP"
      - "edge inference"
      - "efficient transformers"

  blogs:
    enabled: true
    sources:
      - "https://huggingface.co/blog"
      - "https://anthropic.com/research"

# LLM settings
llm:
  provider: "anthropic"  # anthropic or openai
  model: "claude-sonnet-4-6"  # default / fallback for any stage not overridden
  # Per-stage overrides: cheap Haiku for the high-volume relevance filter,
  # a stronger model for extraction and the quality gates.
  models:
    relevance: "claude-haiku-4-5"    # stage 2
    extraction: "claude-sonnet-4-6"  # stage 3
    gate: "claude-sonnet-4-6"        # stage 4 (use claude-opus-4-8 for the hardest gates)
  temperature: 0.1
  max_tokens: 4096
  max_retries: 3    # SDK auto-retries 429/5xx with exponential backoff
  max_workers: 4    # concurrent LLM calls per stage (1 = sequential)
  api_key_env: "ANTHROPIC_API_KEY"  # Environment variable name
  # Optional ANTHROPIC_WORKSPACE_ID in the environment targets a specific
  # workspace — no workspace ID is committed to this repo.

# Relevance filtering (Stage 2)
relevance:
  min_score: 7.0  # Out of 10
  criteria:
    - "Applicable to mobile/edge devices (not cloud-only)"
    - "Relevant to RAG, embeddings, retrieval, or document Q&A"
    - "Practical implementation (not purely theoretical)"
    - "Novel contribution (not incremental improvement)"

# Quality gate thresholds (Stage 4). Enforced in code against each gate's
# overall_score (see _gates._apply_threshold). Tune these with calibrate.py.
quality_gate:
  gate1_min_score: 6.0  # Problem validation
  gate2_min_score: 6.0  # Solution understanding
  gate3_min_score: 6.0  # Feasibility & ROI

# Prioritization weights (Stage 5)
prioritization:
  impact_weight: 0.5
  effort_weight: 0.3
  confidence_weight: 0.2

# Duplicate detection (Stage 6)
duplicates:
  similarity_threshold: 0.8  # Cosine similarity for idea comparison
  check_against_existing: true

# Feedback loop: retrieve relevant completed-PoC outcomes (knowledge/outcomes.jsonl)
# into Gate 1 so the grader refuses re-proposing settled/rejected work and carries
# lessons forward. Token-overlap ranking by default; use_embeddings for semantic.
knowledge:
  enabled: true
  top_k: 3
  min_score: 0.04
  use_embeddings: false
  model: "sentence-transformers/all-MiniLM-L6-v2"

# System context (current baseline)
system_context:
  device: "iPhone 15 Pro"
  ram_budget: "6GB"
  embedding_model: "EmbeddingGemma 300M (600 MB)"
  llm_model: "Qwen2.5-1.5B Q4 (1.0 GB)"
  retrieval: "Hybrid: 0.7 semantic + 0.3 BM25"
  dataset: "CUAD contracts (397 documents, 1,325 Q&A items)"
  current_recall: 61.4
  current_key_fact_accuracy: 67.9
  completed_pocs:
    - "PoC 006: Dataset baseline established"
    - "PoC 007: Hybrid retrieval baseline (61.4% recall)"
    - "PoC 008: Tested 3 embedding models (EmbeddingGemma best)"
    - "PoC 009: Tested retrieval depth (3 chunks optimal)"
    - "PoC 010: Tested BM25-only (reject: -15 points)"
